name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ruff + pytest
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install --require-hashes -r requirements.txt -r requirements-dev.txt

      # ffmpeg — для тестов подготовки аудио (T-5); тесты генерируют короткие файлы сами
      - name: Install ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg

      - name: Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Pytest (без GPU)
        run: pytest

  hadolint:
    name: hadolint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Hadolint Dockerfile
        run: docker run --rm -i hadolint/hadolint:v2.14.0@sha256:27086352fd5e1907ea2b934eb1023f217c5ae087992eb59fde121dce9c9ff21e < Dockerfile

      - name: compose.yml разбирается
        run: docker compose config -q

  image:
    name: docker build (без GPU)
    runs-on: ubuntu-24.04
    needs: hadolint
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      # Образ с torch CUDA и библиотеками nvidia — около 10 ГБ; на чистом раннере места впритык.
      - name: Освободить диск
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker system prune -af
          df -h /

      - name: Build
        run: docker build -t instudy-transkrib:ci .

      - name: Не root
        run: test "$(docker run --rm instudy-transkrib:ci id -u)" = "10001"

      - name: cli version
        run: docker run --rm --read-only --tmpfs /tmp instudy-transkrib:ci python -m transkrib.cli version

      - name: Моделей в образе нет
        run: docker run --rm instudy-transkrib:ci sh -c 'test ! -e /models && ! find / -xdev \( -name "*.ckpt" -o -name "pytorch_model.bin" \) -print -quit | grep -q .'

      - name: GPU-стек импортируется (без GPU), ffmpeg на месте
        run: |
          docker run --rm --read-only --tmpfs /tmp instudy-transkrib:ci \
            python -c "import torch, torchaudio, pyannote.audio, gigaam; print(torch.__version__, torch.version.cuda)"
          docker run --rm instudy-transkrib:ci ffmpeg -hide_banner -version
